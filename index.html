<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Large Sequential Image Grid</title>
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #F7E7E7; /* Dark professional backdrop */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden; /* Keeps screen clean during large slide-ins */
            font-family: sans-serif;
            padding: 20px 0;
        }

        /* Maximum Scale 2x2 Grid Container */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px; /* Stronger spacing to balance the massive image scale */
            width: 100%; /* Uses almost the entire width of the viewport */
            max-width: 1800px; /* Pushed to ultra-wide limit */
            padding: 10px;
        }

        /* Massive Image Wrapper */
        .grid-item {
            position: relative;
            overflow: hidden;
            border-radius: 10px; /* Enhanced corners for a premium, large-canvas look */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            aspect-ratio: 4 / 3; /* Taller aspect ratio makes the images take up much more vertical space */
            opacity: 0; /* Hidden until its specific sequential cue */
            animation-duration: 1.1s; /* Slightly longer duration for an elegant, sweeping entrance */
            animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1);
            animation-fill-mode: forwards;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }

        /* --- Custom Keyframe Animations --- */

        /* Left Side Entry (Longer sweep distance for massive elements) */
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-350px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Right Side Entry (Longer sweep distance for massive elements) */
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(350px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* --- Strict Sequential Timing --- */

        /* 1st Image: Top Left */
        .item-1 {
            animation-name: slideInLeft;
            animation-delay: 0.2s;
        }

        /* 2nd Image: Top Right */
        .item-2 {
            animation-name: slideInRight;
            animation-delay: 1.3s; /* Adjusted spacing for the longer slide duration */
        }

        /* 3rd Image: Bottom Left */
        .item-3 {
            animation-name: slideInLeft;
            animation-delay: 2.4s;
        }

        /* 4th Image: Bottom Right */
        .item-4 {
            animation-name: slideInRight;
            animation-delay: 3.5s;
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <!-- 1: Top Left (From Left) -->
        <div class="grid-item item-1">
            <img src="img1.jpeg">
		</div>

        <!-- 2: Top Right (From Right) -->
        <div class="grid-item item-2">
            <img src="img.jpeg">
		</div>

        <!-- 3: Bottom Left (From Left) -->
        <div class="grid-item item-3">
            <img src="img3.jpeg">
		</div>

        <!-- 4: Bottom Right (From Right) -->
        <div class="grid-item item-4">
            <img src="img4.jpeg">
		</div>
    </div>

</body>
</html>
