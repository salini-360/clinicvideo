<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two Images Animation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#F7E7E7;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    width:90%;
    max-width:1200px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.image-box{
    overflow:hidden;
    border-radius:10px;
    opacity:0;
}

.image-box img{
    width:100%;
    height:400px;
    object-fit:cover;
    display:block;
}

/* Left Image */
.left{
    animation:slideLeft 1s ease forwards;
}

@keyframes slideLeft{
    from{
        opacity:0;
        transform:translateX(-300px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

/* Right Image */
.right{
    animation:slideRight 1s ease forwards;
    animation-delay:0.5s;
}

@keyframes slideRight{
    from{
        opacity:0;
        transform:translateX(300px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}
</style>
</head>

<body>

<div class="container">
    
    <div class="image-box left">
        <img src="image1.jpeg" alt="">
    </div>

    <div class="image-box right">
        <img src="image2.jpeg" alt="">
    </div>

</div>

</body>
</html>
