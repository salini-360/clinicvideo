<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Large Sequential Image Grid</title>
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #F7E7E7; /* Dark professional backdrop */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden; /* Keeps screen clean during large slide-ins */
            font-family: sans-serif;
            padding: 20px 0;
        }

        /* Maximum Scale 2x2 Grid Container */
        .grid-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-areas:
        "img1 img2"
        "img3 img4";
    gap: 20px;
    width: 100%;
    max-width: 1800px;
    padding: 10px;
}

.item-1 { grid-area: img1; }
.item-2 { grid-area: img2; }
.item-3 { grid-area: img3; }
.item-4 { grid-area: img4; }


        /* Massive Image Wrapper */
        .grid-item {
            position: relative;
            overflow: hidden;
            border-radius: 10px; /* Enhanced corners for a premium, large-canvas look */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            aspect-ratio: 4 / 3; /* Taller aspect ratio makes the images take up much more vertical space */
            opacity: 0; /* Hidden until its specific sequential cue */
            animation-duration: 1.1s; /* Slightly longer duration for an elegant, sweeping entrance */
            animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1);
            animation-fill-mode: forwards;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }
		

        /* --- Custom Keyframe Animations --- */

       @keyframes slideInLeft {
    from {
        opacity: 0;
        transform: translateX(-400px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes slideInRight {
    from {
        opacity: 0;
        transform: translateX(400px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

/* 1 and 3 come together from left */
.item-1,
.item-3 {
    animation: slideInLeft 1s ease forwards;
    animation-delay: 0.2s;
}

/* 2 and 4 come together from right after */
.item-2,
.item-4 {
    animation: slideInRight 1s ease forwards;
    animation-delay: 1.4s;
}
    </style>
</head>
<body>

    <div class="grid-container">
        <!-- 1: Top Left (From Left) -->
        <div class="grid-item item-1">
            <img src="img1.jpeg">
		</div>

        <!-- 2: Top Right (From Right) -->
        <div class="grid-item item-2">
            <img src="img.jpeg">
		</div>

        <!-- 3: Bottom Left (From Left) -->
        <div class="grid-item item-3">
            <img src="img3.jpeg">
		</div>

        <!-- 4: Bottom Right (From Right) -->
        <div class="grid-item item-4">
            <img src="img4.jpeg">
		</div>
    </div>

</body>
</html>
